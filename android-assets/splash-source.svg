  <!-- Dark background matching app theme -->
  <rect width="2732" height="2732" fill="#0d0c0a"/>
  <!-- Orange brand mark square -->
  <rect x="1216" y="966" width="300" height="300" rx="48" fill="#FF6B35"/>
  <!-- Brand text: SWIPE -->
